
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BeeSound | Login & Sign Up</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f5f6fc;
            font-family: Arial, sans-serif;
            color: #18213c;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            text-decoration: none;
            color: #18213c;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(24, 33, 60, 0.1);
        }

        .btn-main {
            background: #b33180;
            color: white;
            border: none;
            padding: 12px;
        }

        .btn-main:hover {
            background: #982567;
            color: white;
        }

        .custom-link {
            color: #b33180;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .custom-link:hover {
            text-decoration: underline;
        }

        .form-control:focus {
            border-color: #b33180;
            box-shadow: 0 0 0 0.2rem rgba(179, 49, 128, 0.15);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar bg-white shadow-sm">
        <div class="container">
            <a href="try.html" class="logo"> <img src="file:///C:/Users/Dell/Downloads/Vector.svg"
                     alt="BeeSound Logo"
                     width="30"
                     height="30">

                <span>BeeSound</span>
            </a>

        </div>
    </nav>

    <!-- Auth Section -->
    <section class="container min-vh-100 d-flex justify-content-center align-items-center py-4">

        <div class="card auth-card">
            <div class="card-body p-4 p-md-5">

                <!-- LOGIN FORM -->
                <div id="loginSection">

                    <h2 class="text-center fw-bold mb-2">
                        Welcome Back!
                    </h2>

                    <p class="text-center text-secondary mb-4">
                        Login to your BeeSound account
                    </p>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="loginEmail"
                                class="form-control form-control-lg"
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="loginPassword"
                                class="form-control form-control-lg"
                                placeholder="Enter your password"
                                required
                            >
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="remember"
                                >

                                <label for="remember" class="form-check-label">
                                    Remember me
                                </label>
                            </div>

                            <a href="#" id="forgotPassword" class="custom-link small">
                                Forgot Password?
                            </a>
                        </div>

                        <button type="submit" class="btn btn-main w-100">
                            Sign In
                        </button>

                    </form>

                    <div id="loginMessage" class="text-center mt-3"></div>

                    <p class="text-center mt-4 mb-0">
                        Don't have an account?
                        <a class="custom-link" id="showSignup">
                            Sign Up
                        </a>
                    </p>

                </div>

                <!-- SIGN UP FORM -->
                <div id="signupSection" class="d-none">

                    <h2 class="text-center fw-bold mb-2">
                        Create Account
                    </h2>

                    <p class="text-center text-secondary mb-4">
                        Join BeeSound today!
                    </p>

                    <form id="signupForm">

                        <div class="mb-3">
                            <label for="fullName" class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                class="form-control"
                                placeholder="Enter your full name"
                                minlength="3"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="signupEmail" class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="signupEmail"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="signupPassword" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="signupPassword"
                                class="form-control"
                                placeholder="At least 8 characters"
                                minlength="8"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                placeholder="Confirm your password"
                                minlength="8"
                                required
                            >
                        </div>

                        <div class="form-check mb-4">
                            <input
                                type="checkbox"
                                id="terms"
                                class="form-check-input"
                                required
                            >

                            <label for="terms" class="form-check-label">
                                I agree to the Terms and Conditions
                            </label>
                        </div>

                        <button type="submit" class="btn btn-main w-100">
                            Create Account
                        </button>

                    </form>

                    <div id="signupMessage" class="text-center mt-3"></div>

                    <p class="text-center mt-4 mb-0">
                        Already have an account?
                        <a class="custom-link" id="showLogin">
                            Sign In
                        </a>
                    </p>

                </div>

            </div>
        </div>

    </section>

    <!-- JavaScript -->
    <script>
        const loginSection = document.getElementById("loginSection");
        const signupSection = document.getElementById("signupSection");

        // Switch between forms
        document.getElementById("showSignup").addEventListener("click", function () {
            loginSection.classList.add("d-none");
            signupSection.classList.remove("d-none");
        });

        document.getElementById("showLogin").addEventListener("click", function () {
            signupSection.classList.add("d-none");
            loginSection.classList.remove("d-none");
        });

        // Sign Up validation
        document.getElementById("signupForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const password = document.getElementById("signupPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("signupMessage");

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match!";
                message.className = "text-center mt-3 text-danger";
                return;
            }

            message.textContent =
                "Validation successful! Account creation requires an authentication system.";
            message.className = "text-center mt-3 text-success";
        });

        // Sign In validation
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            document.getElementById("loginMessage").textContent =
                "Please connect an authentication system to sign in.";

            document.getElementById("loginMessage").className =
                "text-center mt-3 text-danger";
        });

        // Forgot Password
        document.getElementById("forgotPassword").addEventListener("click", function (event) {
            event.preventDefault();
            alert("Password recovery is not configured yet.");
        });
    </script>

</body>
</html>
