
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeSound - Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="cart.css">
</head>
<body>

<div class="container cart-page">

    <div class="page-header d-flex justify-content-between align-items-center">
        <h1>Cart</h1>
        <a href="Our Collection.html" class="back-link">← Back To Shopping</a>
    </div>

    <div class="row g-3">
        <div class="col-12 col-sm-6 col-md-6">
            <div class="cart-image">
                <img src="headphone.png" alt="Beats By Dre" class="img-fluid">
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-6">
            <div class="cart-info">
                <h2>Beats By Dre</h2>

                <div class="product-colors">
                    <span class="color black"></span>
                    <span class="color gray"></span>
                    <span class="color navy"></span>
                </div>

                <p class="price">BAM 29.99</p>
                <p class="delivery">
                    <strong>Delivery Time:</strong> 2 work days
                </p>
            </div>
        </div>
    </div>

    <div class="cart-footer">
        <a href="checkout.html" class="btn pink-btn">Checkout</a>
    </div>

</div>

</body>
</html>
