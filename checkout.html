
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeSound - Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

<div class="container checkout-page">

    <div class="page-header d-flex justify-content-between align-items-center">
        <h1>Checkout</h1>
        <a href="cart.html" class="back-link">← Back To Shopping</a>
    </div>

    <form action="#" method="post">

        <div class="shipping-fields">
            <label for="address" class="visually-hidden">Shipping Address</label>
            <input type="text" id="address" name="address"
                   class="form-control"
                   placeholder="Enter Your Shipping Address"
                   required>

            <label for="phone" class="visually-hidden">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   class="form-control"
                   placeholder="Enter Your Phone Number"
                   required>
        </div>

        <h2 class="card-title">Card Details</h2>

        <div class="payment-fields">
            <label for="cardNumber" class="visually-hidden">Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber"
                   class="form-control"
                   placeholder="Enter Your Card Number"
                   inputmode="numeric"
                   autocomplete="cc-number"
                   required>

            <div class="row g-2">
                <div class="col-7">
                    <label for="expiry" class="visually-hidden">Expiration Date</label>
                    <input type="text" id="expiry" name="expiry"
                           class="form-control"
                           placeholder="Expiration Date"
                           autocomplete="cc-exp"
                           required>
                </div>

                <div class="col-5">
                    <label for="cvc" class="visually-hidden">CVC</label>
                    <input type="password" id="cvc" name="cvc"
                           class="form-control"
                           placeholder="CVC"
                           inputmode="numeric"
                           autocomplete="cc-csc"
                           required>
                </div>
            </div>
        </div>

        <div class="checkout-footer">
            <button type="submit" class="btn pink-btn">Order</button>
        </div>

    </form>

</div>

</body>
</html>
